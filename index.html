<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Prototype</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
       <div class="logo">
        <img src="./img/Logo.svg" alt="logo projeto" sizes="" srcset="">
       </div>
      
    </header>

    <main class="game-container">
        <div class="grid">
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
            <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
        </div>
    </main>
    <script type="module" src="game.js"></script>

    <footer class="keyboard">
        <div class="row">
            <button class="key">Q</button><button class="key">W</button><button class="key">E</button>
            <button class="key">R</button><button class="key">T</button><button class="key">Y</button>
            <button class="key">U</button><button class="key">I</button><button class="key">O</button>
            <button class="key">P</button>
        </div>
        <div class="row">
            <div class="spacer"></div>
            <button class="key">A</button><button class="key">S</button><button class="key">D</button>
            <button class="key">F</button><button class="key">G</button><button class="key">H</button>
            <button class="key">J</button><button class="key">K</button><button class="key">L</button>
            <div class="spacer"></div>
        </div>
        <div class="row">
            <button class="key large">ENTER</button>
            <button class="key">Z</button><button class="key">X</button><button class="key">C</button>
            <button class="key">V</button><button class="key">B</button><button class="key">N</button>
            <button class="key">M</button>
            <button class="key large">
                <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg>
            </button>
        </div>
    </footer>

</body>
</html>
